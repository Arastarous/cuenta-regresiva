<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuenta regresiva</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0f1115;
    color: #f2f2f2;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .wrap {
    width: 100%;
    max-width: 560px;
    text-align: center;
  }

  .label {
    font-size: 14px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #8a8f98;
    margin-bottom: 8px;
  }

  .target-date {
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 40px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 32px;
  }

  .cell {
    background: #1a1d24;
    border-radius: 12px;
    padding: 20px 8px;
  }

  .cell .num {
    font-size: 40px;
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  .cell .unit {
    font-size: 12px;
    color: #8a8f98;
    margin-top: 8px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .done {
    font-size: 24px;
    font-weight: 600;
    margin: 12px 0 0;
  }

  @media (max-width: 420px) {
    .cell .num { font-size: 30px; }
    .grid { gap: 8px; }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="label">cuenta regresiva hacia</div>
  <div class="target-date" id="target-label">1 de junio de 2027</div>

  <div class="grid" id="grid">
    <div class="cell"><div class="num" id="days">0</div><div class="unit">días</div></div>
    <div class="cell"><div class="num" id="hours">0</div><div class="unit">horas</div></div>
    <div class="cell"><div class="num" id="mins">0</div><div class="unit">min</div></div>
    <div class="cell"><div class="num" id="secs">0</div><div class="unit">seg</div></div>
  </div>

  <div class="done" id="done-msg" style="display:none;">¡Llegó el día!</div>
</div>

<script>
(function () {
  // ---- Configuración ----
  // Cambia esta fecha para reutilizar la página con otro evento.
  var TARGET = new Date('2027-06-01T00:00:00');

  var daysEl = document.getElementById('days');
  var hoursEl = document.getElementById('hours');
  var minsEl = document.getElementById('mins');
  var secsEl = document.getElementById('secs');
  var grid = document.getElementById('grid');
  var doneMsg = document.getElementById('done-msg');

  function tick() {
    var now = new Date();
    var diff = TARGET.getTime() - now.getTime();

    if (diff <= 0) {
      grid.style.display = 'none';
      doneMsg.style.display = 'block';
      return;
    }

    var days = Math.floor(diff / 86400000);
    var hours = Math.floor((diff % 86400000) / 3600000);
    var mins = Math.floor((diff % 3600000) / 60000);
    var secs = Math.floor((diff % 60000) / 1000);

    daysEl.textContent = days.toLocaleString('es-MX');
    hoursEl.textContent = hours;
    minsEl.textContent = mins;
    secsEl.textContent = secs;
  }

  tick();
  setInterval(tick, 1000);
})();
</script>

</body>
</html>
